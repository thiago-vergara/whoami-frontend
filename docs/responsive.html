<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Whoami · Revisión responsive</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: #f4f4f5;
        color: #18181b;
        font:
          14px system-ui,
          sans-serif;
      }
      header {
        padding: 16px;
        background: white;
        border-bottom: 1px solid #e4e4e7;
      }
      nav {
        display: flex;
        gap: 12px;
        flex-wrap: wrap;
        align-items: center;
      }
      select,
      a {
        min-height: 44px;
        padding: 10px;
        font: inherit;
      }
      a {
        color: #2c6e59;
      }
      p {
        margin-bottom: 0;
      }
      main {
        padding: 16px;
        overflow: hidden;
      }
      .stage {
        transform-origin: top left;
      }
      iframe {
        display: block;
        border: 0;
        outline: 1px solid #e4e4e7;
        background: white;
        height: 1100px;
      }
    </style>
  </head>
  <body>
    <header>
      <nav>
        <label
          >Ancho
          <select id="width">
            <option>320</option>
            <option>390</option>
            <option>768</option>
            <option selected>1440</option>
          </select></label
        >
        <label
          >Pantalla
          <select id="page">
            <option value="/">Inicio</option>
            <option value="/login">Login</option>
            <option value="/registro">Registro</option>
            <option value="/recuperar">Recuperar acceso</option>
          </select></label
        >
        <a href="/">Abrir aplicación</a>
      </nav>
      <p>
        Herramienta local de revisión. Muestra la aplicación real y escala la vista; no añade datos
        ni una sesión de demostración.
      </p>
      <p><output id="dimensions" aria-live="polite">Cargando medidas…</output></p>
    </header>
    <main>
      <div class="stage"><iframe title="Aplicación Whoami" src="/"></iframe></div>
    </main>
    <script>
      const frame = document.querySelector('iframe')
      const stage = document.querySelector('.stage')
      const width = document.querySelector('#width')
      function report() {
        const content = frame.contentDocument?.documentElement
        if (content)
          document.querySelector('#dimensions').textContent =
            `Ventana: ${frame.contentWindow.innerWidth}px · Área útil: ${content.clientWidth}px · Contenido: ${content.scrollWidth}px · ${content.scrollWidth <= content.clientWidth ? 'Sin desborde horizontal' : 'Revisar desborde horizontal'}`
      }
      function resize() {
        frame.style.width = `${width.value}px`
        const scale = Math.min(
          1,
          (document.querySelector('main').clientWidth - 32) / Number(width.value),
        )
        stage.style.transform = `scale(${scale})`
        document.querySelector('main').style.height = `${1100 * scale + 32}px`
        requestAnimationFrame(report)
      }
      width.addEventListener('change', resize)
      window.addEventListener('resize', resize)
      document.querySelector('#page').addEventListener('change', (event) => {
        frame.src = event.target.value
      })
      frame.addEventListener('load', () => {
        frame.contentDocument.fonts.ready.then(report)
      })
      resize()
    </script>
  </body>
</html>
